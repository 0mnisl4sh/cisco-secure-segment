<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
<style>
  text{font-family:"Liberation Sans",Arial,sans-serif;fill:#000}
